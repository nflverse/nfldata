on:
  workflow_dispatch:
  push:
    paths: ["data/games.rds"]

name: Update nflverse-data@schedule release
# Lee pushes data updates every few minutes on game days: queue releases
# instead of running two at once.
concurrency:
  group: release-games
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_games:
    runs-on: ubuntu-latest
    container: ghcr.io/nflverse/r-runner:latest
    steps:
      # Checkout (depth 1, the repo history is several GB) + nflverse
      # packages at their latest commit
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflverse-data nflverse/nflreadr

      # write access to nflverse-data only. Minted after setup, which
      # installs unpinned GitHub code.
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data
          contents: write

      - name: Release games data
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
        run: |
          cli::rule("Start games data update process")
          # Load currently released data
          released <- nflreadr::rds_from_url(paste0(
            "https://github.com/nflverse/nflverse-data/",
            "releases/download/schedules/games.rds"
          ))
          # Load data in nfldata repo
          repo_data <- readRDS("data/games.rds")
          # The workflow should only trigger if the data changed but it doesn't hurt
          # to make sure we only update the data if the comparison shows that something
          # really has changed
          if (!identical(data.frame(released), data.frame(repo_data))) {
            cli::cli_alert_info("Going to release updated games data.")
            # Failed downloads make nflreadr return a 0 row dataframe.
            # In that case we just use repo data and push it
            out <- if (nrow(released) > 0) {
              dplyr::rows_upsert(released, repo_data, by = "game_id")
            } else {
              repo_data
            }
            nflversedata::nflverse_save(
              data_frame = out,
              file_name = "games",
              nflverse_type = "games and schedules",
              release_tag = "schedules",
              file_types = c("rds", "csv", "parquet", "csv.gz"),
            )
          } else {
            cli::cli_alert_success("Nothing changed. Games data is up to date.")
          }
          cli::rule("Process complete")
        shell: Rscript {0}
